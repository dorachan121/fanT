# Walks through the main screens on the iOS simulator and takes screenshots
# (.github/workflows/screenshots.yml). The simulator has no camera, so the
# camera preview stays empty; everything around it is real.
appId: com.fant.camera.dev
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'つぎへ'
    timeout: 60000
- takeScreenshot: 01-onboarding-1
- tapOn: 'つぎへ'
- takeScreenshot: 02-onboarding-2
- tapOn: 'つぎへ'
- takeScreenshot: 03-onboarding-3
- tapOn: 'はじめる！'
- waitForAnimationToEnd
- takeScreenshot: 04-camera-film
- tapOn:
    text: 'フィルム'
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 05-film-sheet
- tapOn:
    text: '閉じる'
    optional: true
- tapOn:
    text: '美肌'
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 06-beauty-sheet
- tapOn:
    text: '閉じる'
    optional: true
- tapOn:
    text: '.*動画'
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 07-camera-video
- tapOn:
    text: '.*キャラ'
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 08-camera-character
- tapOn:
    text: '.*プリ'
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 09-puri-layouts
- tapOn:
    text: '戻る'
    optional: true
- tapOn:
    text: '.*フィルム'
    index: 0
    optional: true
- tapOn:
    text: '設定を開く'
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 10-settings
- scroll
- takeScreenshot: 11-settings-more
- tapOn:
    text: 'プレミアム'
    index: 0
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 12-paywall
- tapOn:
    text: '閉じる|戻る'
    optional: true
- tapOn:
    text: '規約とポリシー'
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: 'ライセンス'
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 13-licenses
- tapOn:
    text: '戻る'
    optional: true
- tapOn:
    text: '戻る'
    optional: true
- tapOn:
    text: '戻る'
    optional: true
- tapOn:
    text: 'アルバムを開く'
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 14-album-empty
# Import one of the simulator's sample photos and open it in the editor.
- tapOn:
    text: '写真を読み込む'
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 15-photo-picker
- tapOn:
    point: '20%,25%'
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: '追加|Add|完了|Done'
    optional: true
- extendedWaitUntil:
    visible: '編集'
    timeout: 30000
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 16-edit-film
- tapOn:
    text: '美肌'
    optional: true
- takeScreenshot: 17-edit-beauty
- tapOn:
    text: 'メイク'
    optional: true
- takeScreenshot: 18-edit-makeup
- tapOn:
    text: 'レタッチ'
    optional: true
- takeScreenshot: 19-edit-retouch
- tapOn:
    text: 'トーン'
    optional: true
- takeScreenshot: 20-edit-tone
- tapOn:
    text: 'カラー'
    optional: true
- takeScreenshot: 21-edit-hsl
- scrollUntilVisible:
    element: 'フレーム'
    direction: RIGHT
    optional: true
- tapOn:
    text: 'フレーム'
    optional: true
- takeScreenshot: 22-edit-frame
- tapOn:
    text: '保存'
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 23-photo
- tapOn:
    text: 'デコ'
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 24-deco
