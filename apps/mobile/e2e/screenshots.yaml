# Walks through the main screens on the iOS simulator and takes screenshots
# (.github/workflows/screenshots.yml). The simulator has no camera, so the
# camera preview stays empty; everything around it is real.
appId: com.fant.camera.dev
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'つぎへ'
    timeout: 60000
- takeScreenshot: 01-onboarding-1
- tapOn: 'つぎへ'
- takeScreenshot: 02-onboarding-2
- tapOn: 'つぎへ'
- takeScreenshot: 03-onboarding-3
- tapOn: 'はじめる！'
- waitForAnimationToEnd
- takeScreenshot: 04-camera-film
- tapOn:
    text: 'フィルム'
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 05-film-sheet
- tapOn:
    text: '閉じる'
    optional: true
- tapOn:
    text: '美肌'
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 06-beauty-sheet
- tapOn:
    text: '閉じる'
    optional: true
- tapOn:
    text: '.*動画'
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 07-camera-video
- tapOn:
    text: '.*キャラ'
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 08-camera-character
- tapOn:
    text: '.*プリ'
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 09-puri-layouts
- tapOn:
    text: '戻る'
    optional: true
- tapOn:
    text: '.*フィルム'
    index: 0
    optional: true
# A sheet left open (the character's colours) would block the top bar.
- tapOn:
    text: '閉じる'
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: '設定を開く'
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 10-settings
- scroll
- takeScreenshot: 11-settings-more
# Settings rows read as "label, value", so match the start of the label.
- tapOn:
    text: 'プレミアム.*'
    index: 0
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 12-paywall
- tapOn:
    text: '閉じる|戻る'
    optional: true
- waitForAnimationToEnd
- scrollUntilVisible:
    element: '規約とポリシー.*'
    optional: true
- tapOn:
    text: '規約とポリシー.*'
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: 'ライセンス.*'
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 13-licenses
# Back to the camera however deep settings went: relaunch, keeping the state.
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: 'アルバムを開く'
    timeout: 30000
    optional: true
- tapOn:
    text: 'アルバムを開く'
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 14-album-empty
# The system photo picker does not open under the simulator's UI tests, so add
# the sample landscape that developer builds draw (settings, developer section).
- tapOn:
    text: '戻る'
    optional: true
- tapOn:
    text: '設定を開く'
    optional: true
- scrollUntilVisible:
    element: '見本の写真をアルバムに追加.*'
    optional: true
- tapOn:
    text: '見本の写真をアルバムに追加.*'
    optional: true
- tapOn:
    text: 'OK'
    optional: true
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: 'アルバムを開く'
    timeout: 30000
    optional: true
- tapOn:
    text: 'アルバムを開く'
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 15-album
# The sample is the first photo, top left; open it, then the editor.
- tapOn:
    point: '17%,24%'
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: '編集'
    optional: true
- extendedWaitUntil:
    visible: 'プリセット'
    timeout: 30000
    optional: true
- waitForAnimationToEnd
